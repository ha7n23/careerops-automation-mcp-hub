[project]
name = "careerops-automation-mcp-hub"
version = "0.1.0"
description = "MCP-native application operations and automation layer for CareerOps."
readme = "README.md"
authors = [
    { name = "Huzaifa Amjad", email = "ha7n23@soton.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
